name: Weekly Beverage Trend Radar Update & Deploy

on:
  schedule:
    # 每週一台灣時間早上 09:00 (UTC 01:00) 自動執行
    - cron: '0 1 * * 1'
  workflow_dispatch: # 允許在 GitHub Actions 網頁上手動點擊 Run workflow 立即測試驗證

permissions:
  contents: write

jobs:
  update-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出專案原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 執行每週飲品新品爬蟲、五維度算分、前端同步與自我驗證
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/weekly_updater.py

      - name: 4. 自動提交最新週期資料庫與前端數據至 main 分支 (自動觸發 GitHub Pages 部署)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ dashboard/
          if git diff --staged --quiet; then
            echo "[OK] 資料已是最新狀態，無須重複提交。"
          else
            git commit -m "chore: 每週自動更新飲品熱度戰情室數據"
            git pull --rebase origin main
            git push origin main
            echo "[OK] 已成功推送至 main 分支並觸發 GitHub Pages 更新！"
          fi
